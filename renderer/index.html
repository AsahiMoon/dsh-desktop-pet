<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' pet:; style-src 'self' 'unsafe-inline'; img-src 'self' pet: data:; script-src 'self'" />
  <title>dsh-desktop-pet</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <div id="stage">
    <div id="pet">
      <div id="sprite" aria-hidden="true"></div>
    </div>
    <div id="bubble" class="hidden"></div>
    <div id="statusbar" class="hidden"></div>
    <div id="settings" class="hidden" role="dialog">
      <div class="settings-title">⚙️ 设置</div>
      <label>角色 <select id="character-select"></select></label>
      <label>大小 <span id="size-value"></span>px
        <input id="size-range" type="range" min="64" max="256" step="4" />
      </label>
      <label>透明度 <span id="opacity-value"></span>
        <input id="opacity-range" type="range" min="20" max="100" step="2" />
      </label>
      <label class="check-row"><input id="task-bar-persistent" type="checkbox" /> 常驻显示任务进度</label>
      <label class="check-row"><input id="task-bar-detailed" type="checkbox" /> 详细进度（显示最近完成的任务）</label>
      <label class="check-row"><input id="hide-when-idle" type="checkbox" /> 空闲时自动隐藏</label>
      <div class="paths">
        <div id="paths-info" class="paths-info"></div>
        <button id="open-characters">📂 角色文件夹</button>
        <button id="open-config">📂 配置文件</button>
      </div>
      <button id="settings-close">完成</button>
    </div>
    <div id="chat" class="hidden" role="dialog" aria-label="对话">
      <div class="chat-title">
        <button id="chat-session-picker" class="chat-session-btn" title="选择历史会话">🗂️</button>
        <button id="chat-new" class="chat-new-btn" title="开启新对话">➕</button>
        <span id="chat-avatar" class="chat-avatar" aria-hidden="true"></span>
        <span id="chat-title-label">🐳 与鲸鱼娘对话</span>
        <button id="chat-maximize" class="chat-maximize-btn" title="最大化 / 还原面板大小">⛶</button>
        <button id="chat-close" aria-label="关闭">✕</button>
      </div>
      <div id="chat-sessions" class="chat-sessions hidden"></div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-row">
        <textarea id="chat-input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行…"></textarea>
        <button id="chat-send">发送</button>
      </div>
      <div id="chat-stats" class="chat-stats"></div>
      <div id="chat-hint" class="chat-hint"></div>
      <div class="chat-resize" aria-hidden="true">
        <div class="chat-resize-edge chat-resize-left" title="拖动调整宽度"></div>
        <div class="chat-resize-edge chat-resize-right" title="拖动调整宽度"></div>
        <div class="chat-resize-bottom" title="拖动调整高度"></div>
      </div>
    </div>
  </div>
  <script src="core.js"></script>
  <script src="pet.js"></script>
</body>
</html>
