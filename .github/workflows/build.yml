name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: npm run dist
            artifact: dsh-desktop-pet-win
          - os: macos-latest
            script: npm run dist:mac
            artifact: dsh-desktop-pet-mac
          - os: ubuntu-latest
            script: npm run dist:linux
            artifact: dsh-desktop-pet-linux
    runs-on: ${{ matrix.os }}
    env:
      # unsigned builds on macOS / Linux (no signing identity in CI)
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Package
        run: ${{ matrix.script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.blockmap
          if-no-files-found: error
